name: Refresh dashboard data

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}       # lets you trigger it manually too

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest export
        run: |
          curl -L "https://contactlaw.sharepoint.com/:x:/s/PaymentsReceived/IQAgUP_DcUh6TKqOZjFFK6bkAaANwkhgjXfFrvUR7kcxVVg?e=BYEMzV&download=1" -o data.csv

      - name: Sanity-check the download
        run: |
          if head -c 100 data.csv | grep -qi "<!DOCTYPE\|<html"; then
            echo "::error::Downloaded file looks like an HTML login page, not CSV. The SharePoint link likely needs authentication that curl doesn't have."
            cat data.csv
            exit 1
          fi
          echo "Download looks like real data:"
          head -3 data.csv

      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.csv
          git diff --cached --quiet || git commit -m "Auto refresh $(date -u)"
          git push
